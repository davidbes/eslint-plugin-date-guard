name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          node -e 'const pkg = require("./package.json"); const expected = "v" + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error("Release tag " + process.env.GITHUB_REF_NAME + " does not match package version " + expected); }'

      - name: Stage publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: npm stage publish --dry-run

      - name: Stage publish
        if: github.event_name == 'release'
        run: npm stage publish
